
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <rect width="100" height="100" fill="#14303A" />
    <g >
      <!-- Cel-shaded planet sticker body -->
      <circle cx="50" cy="50" r="42" fill="#F4E9D4" stroke="#1E2B33" stroke-width="4" stroke-linejoin="round" />
      <!-- Shadow crescent at bottom-right (clipped) -->
      <g clip-path="url(#planetClip)">
        <circle cx="62" cy="62" r="38" fill="#D6C8AF" />
        <!-- Top-left highlight blob + dot -->
        <ellipse cx="36" cy="34" rx="10" ry="6" transform="rotate(-30 36 34)" fill="#FFFFFF" />
        <circle cx="44" cy="24" r="3.2" fill="#FFFFFF" />
      </g>
      <!-- Coral blush on cheeks -->
      <ellipse cx="32" cy="56" rx="5.5" ry="3.2" fill="#FF6B57" />
      <ellipse cx="68" cy="56" rx="5.5" ry="3.2" fill="#FF6B57" />
      <!-- Ink eyes with white glints -->
      <circle cx="39" cy="48" r="5" fill="#1E2B33" />
      <circle cx="37.5" cy="46" r="1.8" fill="#FFFFFF" />
      <circle cx="61" cy="48" r="5" fill="#1E2B33" />
      <circle cx="59.5" cy="46" r="1.8" fill="#FFFFFF" />
      <!-- Cute open smile mouth -->
      <path d="M46 54 Q50 60 54 54" fill="#FF6B57" stroke="#1E2B33" stroke-width="2.5" stroke-linecap="round" />
      <!-- Golden crown star on top-right -->
      <polygon points="72,16 75,23 82,23 76,27 78,34 72,30 66,34 68,27 62,23 69,23" fill="#FFC145" stroke="#1E2B33" stroke-width="2.5" stroke-linejoin="round" />
    </g>
    <defs>
      <clipPath id="planetClip">
        <circle cx="50" cy="50" r="42" />
      </clipPath>
    </defs>
  </svg>
  