<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="helmetGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#C4B5FD" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- Dark Cosmic Circle Background -->
  <circle cx="32" cy="32" r="30" fill="#180A38" stroke="#D8B4FE" stroke-width="2"/>

  <!-- Mochi Cape -->
  <path d="M16 48 Q32 58 48 48 L46 54 Q32 60 18 54 Z" fill="#6D28D9"/>

  <!-- Fluffy Cloud Body & Ears -->
  <circle cx="20" cy="22" r="8" fill="#FFFFFF"/>
  <circle cx="44" cy="22" r="8" fill="#FFFFFF"/>
  <circle cx="16" cy="34" r="7" fill="#FFFFFF"/>
  <circle cx="48" cy="34" r="7" fill="#FFFFFF"/>
  <ellipse cx="32" cy="32" rx="18" ry="16" fill="#FFFFFF"/>

  <!-- Cheeks Blush -->
  <ellipse cx="22" cy="36" rx="3.5" ry="2" fill="#FF70A6" opacity="0.65"/>
  <ellipse cx="42" cy="36" rx="3.5" ry="2" fill="#FF70A6" opacity="0.65"/>

  <!-- Big Glossy Eyes with Star Reflections -->
  <ellipse cx="25" cy="31" rx="3.5" ry="5" fill="#1E0A34"/>
  <polygon points="25,28 25.8,30 27.8,30.2 26.2,31.4 26.8,33.2 25,32 23.2,33.2 23.8,31.4 22.2,30.2 24.2,30" fill="#FFFFFF" transform="scale(0.55) translate(18,17)"/>
  <circle cx="26" cy="34" r="0.8" fill="#FFFFFF"/>

  <ellipse cx="39" cy="31" rx="3.5" ry="5" fill="#1E0A34"/>
  <polygon points="25,28 25.8,30 27.8,30.2 26.2,31.4 26.8,33.2 25,32 23.2,33.2 23.8,31.4 22.2,30.2 24.2,30" fill="#FFFFFF" transform="scale(0.55) translate(43,17)"/>
  <circle cx="40" cy="34" r="0.8" fill="#FFFFFF"/>

  <!-- Tiny Cute Smile -->
  <path d="M30 36 Q32 38 34 36" fill="none" stroke="#1E0A34" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Transparent Bubble Helmet -->
  <circle cx="32" cy="31" r="23" fill="url(#helmetGlow)" stroke="#E9D5FF" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M16 22 A 20 20 0 0 1 34 11" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Helmet Ear Phones -->
  <rect x="7" y="27" width="5" height="10" rx="2.5" fill="#4338CA" stroke="#A5B4FC" stroke-width="1"/>
  <rect x="52" y="27" width="5" height="10" rx="2.5" fill="#4338CA" stroke="#A5B4FC" stroke-width="1"/>

  <!-- Golden Antenna with Glowing Star -->
  <path d="M16 16 Q13 10 16 6" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <polygon points="16,3 17.5,6.5 21,7 18.5,9.5 19,13 16,11 13,13 13.5,9.5 11,7 14.5,6.5" fill="url(#starGlow)"/>
</svg>
