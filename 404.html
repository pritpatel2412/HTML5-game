<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Lost in the Cosmic Void | Stardust Merge</title>
  <meta name="description" content="The celestial page you are looking for has drifted past the cosmic event horizon. Return to Stardust Merge to drop and merge glowing orbs." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/HTML5-game/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/HTML5-game/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/HTML5-game/apple-touch-icon.png" />
  <link rel="manifest" href="/HTML5-game/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-top: #0B1020;
      --bg-mid: #1B1448;
      --bg-bot: #2A1A5E;
      --glass-bg: rgba(24, 30, 58, 0.75);
      --glass-border: rgba(94, 242, 255, 0.25);
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --accent-cyan: #5EF2FF;
      --accent-gold: #FFD166;
      --font-display: 'Fredoka', -apple-system, sans-serif;
      --font-ui: 'Nunito', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
      color: var(--text-primary);
      font-family: var(--font-ui);
      text-align: center;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 44px 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    .orb-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFE45E 0%, #FF5DA2 50%, #2A1A5E 100%);
      box-shadow: 0 0 32px rgba(255, 93, 162, 0.5), inset 0 0 16px rgba(94, 242, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 2.2rem;
      color: var(--accent-cyan);
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-play {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #3D9BFF 100%);
      color: #070B19;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(94, 242, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-play:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(94, 242, 255, 0.5);
    }
    .nav-links {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }
    .nav-links a {
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb-icon">🌌</div>
    <h1>404 — Cosmic Singularity</h1>
    <p>
      The celestial coordinates you requested have collapsed past the cosmic Event Horizon. Don't worry—the glass containment vessel is safe and waiting.
    </p>
    <a href="/HTML5-game/" class="btn-play">🎮 Play Stardust Merge</a>
    <div class="nav-links">
      <a href="/HTML5-game/how-to-play/">How to Play</a>
      <a href="/HTML5-game/tips-and-strategy/">Strategy Guide</a>
      <a href="/HTML5-game/tiers/">Orb Tiers</a>
      <a href="/HTML5-game/game-modes/">Game Modes</a>
      <a href="/HTML5-game/about/">About</a>
    </div>
  </div>
</body>
</html>
